[package]
name = "emulsion"
version = "0.1.0"
description = "Film looks for digital photos"
authors = ["Oli Mower"]
license = "GPL-3.0-or-later"
repository = ""
edition = "2024"
default-run = "emulsion"

[features]
# The CLI adds process memory measurements; the app loads AI only on demand.
denoise-probe = []

[[bin]]
name = "denoise-probe"
path = "src/bin/denoise_probe.rs"
required-features = ["denoise-probe"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "emulsion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = { version = "1.10.0", features = ["parallel"] }
tauri-build = { version = "2", features = [] }
walkdir = "2.5.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
walkdir = "2.5.0"
half = "2.7.1"
blake3 = "1.8.7"
natord = "1.0.9"
thiserror = "2"
rayon = "1.12.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
kamadak-exif = "0.6.1"
tauri-plugin-opener = "2"
percent-encoding = "2.3.2"
tauri = { version = "2", features = [] }
ort = { version = "=2.0.0-rc.11", default-features = false, features = ["std", "load-dynamic", "coreml"] }
sha2 = "0.10"
libc = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Full-resolution AI tile packing/cache I/O must remain responsive in tauri dev.
[profile.dev.package.emulsion]
opt-level = 2

[dev-dependencies]
tempfile = "3.27.0"
